services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nick_job_agent
      POSTGRES_USER: nick_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U nick_agent"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://nick_agent:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/nick_job_agent
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_SEMANTIC_ANALYSES_PER_SCAN: ${LLM_MAX_SEMANTIC_ANALYSES_PER_SCAN:-10}
      CANDIDATE_PROFILE_PATH: ${CANDIDATE_PROFILE_PATH:-../data/profile.local.json}
      CANDIDATE_PREFERENCES_PATH: ${CANDIDATE_PREFERENCES_PATH:-../data/preferences.local.json}
      CANDIDATE_EVIDENCE_PATH: ${CANDIDATE_EVIDENCE_PATH:-../data/evidence.local.json}
      CANDIDATE_ANSWER_BANK_PATH: ${CANDIDATE_ANSWER_BANK_PATH:-../data/answer_bank.local.json}
      CANDIDATE_APPLICATION_POLICY_PATH: ${CANDIDATE_APPLICATION_POLICY_PATH:-../data/application_policy.local.json}
      CANDIDATE_PRIVATE_STORAGE_PATH: ${CANDIDATE_PRIVATE_STORAGE_PATH:-../data/private}
      STARTER_DISCOVERY_CATALOG_PATH: ${STARTER_DISCOVERY_CATALOG_PATH:-../data/discovery_sources.example.json}
      DISCOVERY_MAX_SOURCES_PER_RUN: ${DISCOVERY_MAX_SOURCES_PER_RUN:-20}
      DASHBOARD_MAX_JOBS_PER_COMPANY: ${DASHBOARD_MAX_JOBS_PER_COMPANY:-3}
      RESUME_EXTRACTION_MAX_TOKENS: ${RESUME_EXTRACTION_MAX_TOKENS:-6000}
      RESUME_EXTRACTION_TIMEOUT_SECONDS: ${RESUME_EXTRACTION_TIMEOUT_SECONDS:-90}
      DEMO_MODE: ${DEMO_MODE:-false}
      CONTACT_DISCOVERY_MAX_PAGES_PER_JOB: ${CONTACT_DISCOVERY_MAX_PAGES_PER_JOB:-10}
      CONTACT_DISCOVERY_MAX_CONTACTS: ${CONTACT_DISCOVERY_MAX_CONTACTS:-5}
      CONTACT_DISCOVERY_TIMEOUT_SECONDS: ${CONTACT_DISCOVERY_TIMEOUT_SECONDS:-10}
      CONTACT_DISCOVERY_FRESHNESS_HOURS: ${CONTACT_DISCOVERY_FRESHNESS_HOURS:-168}
      CONTACT_DISCOVERY_MIN_RELEVANCE_SCORE: ${CONTACT_DISCOVERY_MIN_RELEVANCE_SCORE:-28}
      CONTACT_DISCOVERY_BROWSER_FALLBACK_ENABLED: ${CONTACT_DISCOVERY_BROWSER_FALLBACK_ENABLED:-true}
      CONTACT_DISCOVERY_BROWSER_MAX_PAGES: ${CONTACT_DISCOVERY_BROWSER_MAX_PAGES:-3}
      CONTACT_DISCOVERY_BROWSER_TIMEOUT_SECONDS: ${CONTACT_DISCOVERY_BROWSER_TIMEOUT_SECONDS:-15}
      AUTO_SUBMIT_ENABLED: "false"
      APPLICATION_MODE: manual
    depends_on: {migrate: {condition: service_completed_successfully}}
    ports: ["8000:8000"]
    volumes:
      - artifacts:/generated
      - ./data:/data
      - ./documents:/documents:ro
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend_env
    depends_on: {migrate: {condition: service_completed_successfully}}
    volumes:
      - artifacts:/generated
      - ./data:/data:ro
      - ./documents:/documents:ro
  scheduler:
    build: ./backend
    command: python -m app.scheduler
    environment: *backend_env
    depends_on: {migrate: {condition: service_completed_successfully}}
    volumes:
      - ./data:/data:ro
      - ./documents:/documents:ro
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: *backend_env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:8000", INTERNAL_API_URL: "http://api:8000", PORT: "3000", HOSTNAME: "0.0.0.0"}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {postgres_data: {}, artifacts: {}}

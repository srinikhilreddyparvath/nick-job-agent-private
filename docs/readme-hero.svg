<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">RoleCall</title>
  <desc id="desc">RoleCall — Automate the search. Not the ambition. Find, evaluate, and prepare the opportunities worth your attention.</desc>
